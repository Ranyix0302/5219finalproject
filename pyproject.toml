[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ge5219-mcda"
version = "0.1.0"
description = "Reproducible residential proximity MCDA for GE5219"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "geopandas>=1.0", "pyogrio>=0.9", "shapely>=2.0", "requests>=2.31", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "pandas-stubs", "types-requests"]

[project.scripts]
ge5219 = "ge5219.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

